<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>RS 다이나믹스</title>
<style>
:root{
  --ground:#FFFFFF; --panel:#F7F9FC; --panel2:#EBF0F7; --hair:#DBE2EC;
  --text:#111A27; --muted:#57677E; --faint:#8E9DB2;
  /* 흰 배경에서도 읽히도록 어두운 쪽으로 잡았다. 원래 다크용 색을 그대로 쓰면
     노랑·청록이 배경에 묻혀 4분면 구분이 사라진다. */
  --lead:#C07C0A; --improve:#0E857A; --weaken:#C43F35; --lag:#8496AB;
  --up:#12A05F; --down:#D6402F;
  /* 차트 전용 */
  --grid:#E9EDF3; --axis:#7C8B9E;
  --ma50:#E0921F; --ma150:#8B9AAF; --ma200:#2F6BD8;
  --mono:ui-monospace,"SFMono-Regular","Roboto Mono",Menlo,monospace;
  --sans:system-ui,"Noto Sans KR",-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ground);color:var(--text);
  font-family:var(--sans);overscroll-behavior-y:none}
body{display:flex;flex-direction:column}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}

/* ── 시장 국면 스트립 ───────────────────────────── */
#market{padding:12px 16px 10px;border-bottom:1px solid var(--hair);flex:none}
#market .top{display:flex;align-items:center;gap:9px}
#market .gauge{font:700 12px/1 var(--sans);letter-spacing:.02em;padding:5px 10px;border-radius:99px;
  background:var(--lead);color:var(--ground)}
#market .gauge.off{background:var(--lag);color:var(--text)}
#market .note{font:500 11px/1 var(--sans);color:var(--muted)}
#market .as-of{margin-left:auto;font:500 10px/1 var(--mono);color:var(--faint)}
#market .stats{margin-top:9px;display:flex;gap:18px}
#market .stats b{font:600 13px/1 var(--mono)}
#market .stats span{font:500 9px/1 var(--sans);letter-spacing:.08em;color:var(--muted);
  display:block;margin-bottom:4px}

/* ── 탭 ─────────────────────────────────────────── */
#views{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.view.on{display:block}
#tabs{flex:none;display:flex;border-top:1px solid var(--hair);background:var(--panel);
  padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;padding:12px 0 14px;font:600 11px/1 var(--sans);color:var(--faint);letter-spacing:.06em}
#tabs button.on{color:var(--text)}
#tabs button i{display:block;width:16px;height:16px;margin:0 auto 6px;border-radius:3px;
  background:currentColor;opacity:.85}
#tabs button:nth-child(2) i{border-radius:50%}

/* ── 테마 스트립 ───────────────────────────────── */
#themes{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
#themes::-webkit-scrollbar{display:none}
.theme{flex:none;padding:9px 12px;border-radius:10px;background:var(--panel);
  border:1px solid var(--hair);min-width:96px}
.theme.on{border-color:var(--lead)}
.theme .n{font:600 11px/1.2 var(--sans);white-space:nowrap}
.theme .c{margin-top:6px;font:700 15px/1 var(--mono)}
.theme .c small{font:500 9px/1 var(--sans);color:var(--muted);margin-left:3px}

/* ── 필터 칩 ───────────────────────────────────── */
#chips{display:flex;gap:7px;overflow-x:auto;padding:14px 16px 10px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--hair);
  font:600 11px/1 var(--sans);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--text);color:var(--ground);border-color:var(--text)}

/* ── 셋업 카드 ─────────────────────────────────── */
#cards{padding:4px 12px 28px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:13px 14px;
  display:grid;grid-template-columns:1fr 76px;gap:12px;align-items:center;text-align:left;width:100%}
.card:active{background:var(--panel2)}
.card .tk{font:700 16px/1 var(--mono);letter-spacing:.02em}
.card .nm{margin-top:4px;font:500 11px/1.2 var(--sans);color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .badges{margin-top:9px;display:flex;gap:5px;flex-wrap:wrap}
.badge{font:600 9px/1 var(--sans);padding:4px 6px;border-radius:5px;letter-spacing:.03em}
.badge.setup{background:var(--text);color:var(--ground)}
.badge.quad{border:1px solid currentColor}
.badge.warn{background:rgba(196,63,53,.10);color:var(--weaken)}
.badge.soft{background:var(--panel2);color:var(--muted)}
.card .right{text-align:right}
.card .rs{font:700 19px/1 var(--mono)}
.card .rs small{font:500 9px/1 var(--sans);color:var(--muted);display:block;margin-top:5px;letter-spacing:.08em}
.card .spark{margin-top:8px}
#empty{padding:60px 24px;text-align:center;color:var(--muted);font:500 13px/1.6 var(--sans)}

/* ── 4분면 ─────────────────────────────────────── */
#mapwrap{position:absolute;inset:0;touch-action:none}
#mapsvg{width:100%;height:100%;display:block}
.axis-line{stroke:var(--hair);stroke-width:1}
.quad-tag{font:600 10px/1 var(--sans);letter-spacing:.14em;fill:var(--muted);opacity:.6}
.tail{fill:none;stroke-linecap:round}
.tick-label{font:600 9px/1 var(--mono);fill:var(--text);opacity:.85;pointer-events:none}
/* 흰 배경에서는 .13 이면 사실상 사라진다. 흐리되 남아 있게. */
.dim{opacity:.22}
.mark{cursor:pointer}
#legend{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 14px;display:flex;gap:13px;
  justify-content:center;flex-wrap:wrap;background:linear-gradient(transparent,var(--ground) 55%);
  pointer-events:none}
#legend span{font:500 10px/1 var(--sans);color:var(--muted);display:flex;align-items:center;gap:5px}
#legend i{width:7px;height:7px;border-radius:50%}
#maphint{position:absolute;top:12px;left:16px;font:500 10px/1.5 var(--sans);color:var(--faint)}

/* ── 상세 ──────────────────────────────────────── */
#detail{position:fixed;inset:0;background:var(--ground);z-index:20;overflow-y:auto;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
#detail.on{transform:translateY(0)}
#dhead{position:sticky;top:0;background:var(--ground);border-bottom:1px solid var(--hair);
  padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:2}
#dhead .tk{font:700 19px/1 var(--mono)}
#dhead .nm{font:500 11px/1 var(--sans);color:var(--muted);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#dback{margin-left:auto;font:600 12px/1 var(--sans);color:var(--muted);padding:8px 4px 8px 14px}
#dbody{padding:0 0 40px}
.sec{padding:20px 16px 0}
.sec h3{margin:0 0 12px;font:600 10px/1 var(--sans);letter-spacing:.14em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.grid dt{font:500 9px/1 var(--sans);letter-spacing:.09em;color:var(--muted);margin-bottom:6px}
.grid dd{margin:0;font:600 15px/1 var(--mono)}
.grid dd small{font:500 10px/1 var(--sans);color:var(--muted);margin-left:4px}
.good{color:var(--improve)} .bad{color:var(--weaken)} .hot{color:var(--lead)}
.stops{display:flex;gap:10px}
.stop{flex:1;background:var(--panel);border:1px solid var(--hair);border-radius:10px;padding:12px}
.stop .lv{font:600 9px/1 var(--sans);letter-spacing:.09em;color:var(--muted)}
.stop .pc{margin-top:8px;font:700 18px/1 var(--mono);color:var(--weaken)}
.stop .px{margin-top:5px;font:500 11px/1 var(--mono);color:var(--muted)}
.reacts{display:flex;gap:7px}
.react{flex:1;background:var(--panel);border:1px solid var(--hair);border-radius:9px;padding:10px 8px;text-align:center}
.react .d{font:500 9px/1 var(--mono);color:var(--faint)}
.react .g{margin-top:7px;font:700 14px/1 var(--mono)}
.react .k{margin-top:5px;font:500 9px/1 var(--sans);color:var(--muted)}
.pp{background:var(--panel);border:1px solid var(--lead);border-radius:11px;padding:14px}
.pp .t{font:700 12px/1 var(--sans);color:var(--lead)}
.pp p{margin:9px 0 0;font:500 12px/1.65 var(--sans);color:var(--muted)}
.note{margin:12px 0 0;font:500 11px/1.65 var(--sans);color:var(--faint)}

/* ── 가격 차트 ─────────────────────────────────── */
.chart-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.seg{display:flex;border:1px solid var(--hair);border-radius:8px;overflow:hidden}
.seg button{padding:6px 11px;font:600 11px/1 var(--sans);color:var(--muted);background:var(--ground)}
.seg button+button{border-left:1px solid var(--hair)}
.seg button.on{background:var(--text);color:var(--ground)}
.chart-range{margin-bottom:7px;font:500 10px/1 var(--mono);color:var(--muted)}
/* pan-y: 세로 스크롤은 시트에 넘기고 가로 끌기만 차트가 가져간다.
   none 으로 막으면 차트 위에서 상세 시트를 스크롤할 수 없다. */
.chart-box{touch-action:pan-y;border:1px solid var(--hair);border-radius:10px;
  background:var(--ground);overflow:hidden}
.chart-box svg{display:block;width:100%;cursor:crosshair}
.chart-empty{padding:28px 0;text-align:center;color:var(--faint);font:500 11px var(--sans)}
</style>

<div id="market">
  <div class="top">
    <span class="gauge" id="m-gauge">—</span>
    <span class="note" id="m-note"></span>
    <span class="as-of" id="m-asof"></span>
  </div>
  <div class="stats">
    <div><span>분산일</span><b id="m-dd">—</b></div>
    <div><span>200일선 위</span><b id="m-ma">—</b></div>
    <div><span>패턴 종목</span><b id="m-setups">—</b></div>
  </div>
</div>

<div id="views">
  <div class="view on" id="v-today">
    <div id="themes"></div>
    <div id="chips"></div>
    <div id="cards"></div>
  </div>
  <div class="view" id="v-map">
    <div id="mapwrap"><svg id="mapsvg"></svg></div>
    <div id="maphint">두 손가락으로 확대 · 점을 눌러 종목 보기</div>
    <div id="legend">
      <span><i style="background:var(--lead)"></i>주도</span>
      <span><i style="background:var(--improve)"></i>개선</span>
      <span><i style="background:var(--weaken)"></i>약화</span>
      <span><i style="background:var(--lag)"></i>부진</span>
    </div>
  </div>
</div>

<nav id="tabs">
  <button class="on" data-v="today"><i></i>오늘</button>
  <button data-v="map"><i></i>지도</button>
</nav>

<div id="detail">
  <div id="dhead">
    <span class="tk" id="d-tk"></span>
    <span class="nm" id="d-nm"></span>
    <button id="dback">닫기</button>
  </div>
  <div id="dbody"></div>
</div>

<script id="seed" type="application/json">/*__DATA__*/</script>
<script>
"use strict";

/* ───────────────────────────────────────────────────────────────
   여기에 스냅샷 주소를 넣으면 앱이 매번 최신 데이터를 받아온다.
   비워두면 파일에 내장된 스냅샷으로 뜬다.

   예: "https://내계정.github.io/rs-data/latest.json"
   ─────────────────────────────────────────────────────────────── */
const SNAPSHOT_URL = "https://mmaximus9981-sudo.github.io/rs-data/latest.json";

const NS="http://www.w3.org/2000/svg";
const QC={"주도":"var(--lead)","개선":"var(--improve)","약화":"var(--weaken)","부진":"var(--lag)"};
const SHAPE={"VCP":"square","W":"triangle","역헤숄":"star","추세선돌파":"diamond","파워플레이":"plus"};
let DATA=null, FILTER="all", THEME=null, SEL=null;

const $=id=>document.getElementById(id);
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
const num=(v,d="—")=>v==null?d:v;
const pct=v=>v==null?"—":(v>0?"+":"")+v+"%";

/* ── 진입점 ────────────────────────────────────── */
window.quadrant={loadSnapshot(j){boot(typeof j==="string"?JSON.parse(j):j);}};

/* 부팅은 스크립트 맨 끝에서 — 아래 const 선언들이 초기화된 뒤여야 한다. */

function boot(snap, source){
  DATA=snap;
  /* 새 스냅샷에 없는 종목이 선택된 채로 남으면 어느 마커와도 일치하지 않아
     지도가 통째로 흐려진다. 사라진 종목이면 선택을 놓는다. */
  if(SEL&&!(snap.tickers||[]).some(t=>t.ticker===SEL)) SEL=null;
  const m=snap.market||{}, meta=snap.meta||{};
  const g=$("m-gauge"); g.textContent=m.m_gauge||"—";
  g.classList.toggle("off",!/확장|상승|매수/.test(m.m_gauge||""));
  $("m-note").textContent=m.note||"";
  /* 어느 데이터로 떠 있는지 숨기지 않는다. 내장 데이터를 실시간으로 착각하는 게 최악이다. */
  $("m-asof").textContent=(meta.as_of||"")+(source&&source!=="원격"?" · "+source:"");
  $("m-dd").textContent=num(m.distribution_days);
  $("m-ma").textContent=m.pct_above_200ma==null?"—":m.pct_above_200ma+"%";
  $("m-setups").textContent=(snap.tickers||[]).filter(t=>t.setup).length;
  renderThemes(); renderChips(); renderCards(); drawMap();
}

/* ── 오늘 ──────────────────────────────────────── */
function renderThemes(){
  const box=$("themes"); box.innerHTML="";
  (DATA.themes||[]).forEach(th=>{
    const b=document.createElement("button");
    b.className="theme"+(THEME===th.name?" on":"");
    b.innerHTML=`<div class="n">${th.name}</div>
                 <div class="c">${th.rs85_count}<small>/${th.count}</small></div>`;
    b.onclick=()=>{THEME=THEME===th.name?null:th.name;renderThemes();renderCards();};
    box.appendChild(b);
  });
}

const FILTERS=[["all","전체"],["setup","패턴"],["lead","주도"],["earn","실적 임박"],["ud","축적"]];
function renderChips(){
  const box=$("chips"); box.innerHTML="";
  FILTERS.forEach(([k,label])=>{
    const b=document.createElement("button");
    b.className="chip"+(FILTER===k?" on":"");
    b.textContent=label;
    b.onclick=()=>{FILTER=k;renderChips();renderCards();};
    box.appendChild(b);
  });
}

function passes(t){
  if(THEME && t.theme!==THEME) return false;
  if(FILTER==="setup") return !!t.setup;
  if(FILTER==="lead")  return t.rs_quad==="주도";
  if(FILTER==="earn")  return t.d_to_earn!=null && t.d_to_earn<=14;
  if(FILTER==="ud")    return t.ud_volume!=null && t.ud_volume>=1.2;
  return true;
}

function renderCards(){
  const box=$("cards"); box.innerHTML="";
  /* 패턴 보유 → 주도 → RS 순. 살 수 있는 것이 위로 온다. */
  const rows=(DATA.tickers||[]).filter(passes).sort((a,b)=>
    (b.setup?1:0)-(a.setup?1:0) || (b.rs_quad==="주도")-(a.rs_quad==="주도") || b.rs-a.rs);
  if(!rows.length){ box.innerHTML='<div id="empty">조건에 맞는 종목이 없습니다.</div>'; return; }
  rows.forEach(t=>box.appendChild(card(t)));
}

function card(t){
  const b=document.createElement("button");
  b.className="card";
  const badges=[];
  if(t.setup) badges.push(`<span class="badge setup">${t.setup}</span>`);
  badges.push(`<span class="badge quad" style="color:${QC[t.rs_quad]||"var(--lag)"}">${t.rs_quad}</span>`);
  if(t.base_count>=3) badges.push(`<span class="badge warn">${t.base_count}차 베이스</span>`);
  if(t.d_to_earn!=null&&t.d_to_earn<=7) badges.push(`<span class="badge warn">D-${t.d_to_earn}</span>`);
  if(t.ud_volume>=1.5) badges.push(`<span class="badge soft">U/D ${t.ud_volume}</span>`);
  b.innerHTML=`<div>
      <div class="tk">${t.ticker}</div>
      <div class="nm">${t.name||""} · ${t.theme||t.sub_industry||""}</div>
      <div class="badges">${badges.join("")}</div>
    </div>
    <div class="right">
      <div class="rs">${num(t.rs)}<small>RS</small></div>
      <div class="spark">${spark(t)}</div>
    </div>`;
  b.onclick=()=>openDetail(t.ticker);
  return b;
}

function spark(t){
  const c=t.series&&t.series.c; if(!c||c.length<5) return "";
  const s=c.slice(-60), lo=Math.min(...s), hi=Math.max(...s), w=72, h=24;
  const d=s.map((v,i)=>`${i?"L":"M"}${(i/(s.length-1)*w).toFixed(1)} ${(h-(v-lo)/((hi-lo)||1)*h).toFixed(1)}`).join(" ");
  const col=s[s.length-1]>=s[0]?"var(--up)":"var(--down)";
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.5"/></svg>`;
}

/* ── 4분면 ─────────────────────────────────────── */
let view={k:1,x:0,y:0};
function drawMap(){
  const svg=$("mapsvg"); if(!DATA) return;
  const w=svg.clientWidth||360, h=svg.clientHeight||480;
  const pad={t:40,r:26,b:64,l:26};
  const ax=DATA.axes||{x_split:90,y_split:50};
  const pts=(DATA.tickers||[]).filter(t=>t.rs_x!=null&&t.rs_y!=null);

  /* 축 범위를 데이터에 맞춘다. [60,100] 으로 못박아 두면 화면이 남아돈다 —
     이 앱에 담기는 건 스크리너를 통과한 종목뿐이라 RS 가 구조적으로 높은
     쪽에 몰리고, 실제로 x 는 80 아래로 내려가지 않는다.
     분면 경계선이 범위 밖으로 밀려나지 않도록 씨앗으로 함께 넣는다.
     그래서 종목이 없거나 한 종목뿐이어도 폭이 0 이 되지 않는다. */
  const span=(vals,split)=>{
    let lo=split, hi=split;
    vals.forEach(v=>{ if(v<lo) lo=v; if(v>hi) hi=v; });
    const m=Math.max((hi-lo)*0.06,1);     // 가장자리 마커와 라벨이 잘리지 않게
    return [lo-m,hi+m];
  };
  const [x0,x1]=span(pts.map(t=>t.rs_x),ax.x_split);
  const [y0,y1]=span(pts.map(t=>t.rs_y),ax.y_split);
  const xs=v=>pad.l+(v-x0)/(x1-x0)*(w-pad.l-pad.r);
  const ys=v=>h-pad.b-(v-y0)/(y1-y0)*(h-pad.t-pad.b);
  svg.setAttribute("viewBox",`0 0 ${w} ${h}`); svg.innerHTML="";
  const g0=el("g",{transform:`translate(${view.x} ${view.y}) scale(${view.k})`});
  svg.appendChild(g0);

  g0.appendChild(el("line",{class:"axis-line",x1:xs(ax.x_split),y1:pad.t,x2:xs(ax.x_split),y2:h-pad.b}));
  g0.appendChild(el("line",{class:"axis-line",x1:pad.l,y1:ys(ax.y_split),x2:w-pad.r,y2:ys(ax.y_split)}));
  [["개선",pad.l+4,pad.t+14,"start"],["주도",w-pad.r-4,pad.t+14,"end"],
   ["부진",pad.l+4,h-pad.b-8,"start"],["약화",w-pad.r-4,h-pad.b-8,"end"]]
   .forEach(([tx,x,y,an])=>{const n=el("text",{class:"quad-tag",x,y,"text-anchor":an});n.textContent=tx;g0.appendChild(n);});

  const fam=SEL?(pts.find(t=>t.ticker===SEL)||{}).sub_industry:null;

  pts.forEach(t=>{
    const on=!SEL||t.ticker===SEL||(fam&&t.sub_industry===fam);
    const g=el("g",{class:"mark"+(on?"":" dim"),"data-tk":t.ticker});
    const c=QC[t.rs_quad]||"var(--lag)", x=xs(t.rs_x), y=ys(t.rs_y);
    /* 이동 경로는 선택한 종목 하나만 그린다. 100종목을 전부 그리면
       화면이 실뭉치가 돼서 정작 위치를 못 읽는다. */
    if(t.ticker===SEL&&Array.isArray(t.trail)&&t.trail.length>1){
      const d=t.trail.map((p,i)=>(i?"L":"M")+xs(p[0])+" "+ys(p[1])).join(" ");
      g.appendChild(el("path",{class:"tail",d:d+` L${x} ${y}`,stroke:c,"stroke-width":1.2,opacity:.55}));
    }
    g.appendChild(marker(t,x,y,c));
    if(t.in_sp500) g.appendChild(el("circle",{cx:x,cy:y,r:1.7,fill:"var(--ground)",opacity:.9}));
    if(on&&(t.rs>=90||t.ticker===SEL||view.k>1.6)){
      const lb=el("text",{class:"tick-label",x,y:y-11,"text-anchor":"middle"});
      lb.textContent=t.ticker; g.appendChild(lb);
    }
    g0.appendChild(g);
  });
}

function marker(t,x,y,c){
  const sh=SHAPE[t.setup]||"circle", r=6, a={fill:c,"fill-opacity":.85,stroke:c,"stroke-width":1};
  if(sh==="square")   return el("rect",{...a,x:x-r,y:y-r,width:r*2,height:r*2,rx:1.5});
  if(sh==="triangle") return el("polygon",{...a,points:`${x},${y-r*1.2} ${x+r},${y+r*.8} ${x-r},${y+r*.8}`});
  if(sh==="diamond")  return el("polygon",{...a,points:`${x},${y-r*1.3} ${x+r*1.1},${y} ${x},${y+r*1.3} ${x-r*1.1},${y}`});
  if(sh==="plus")     return el("path",{stroke:c,"stroke-width":2.6,"stroke-linecap":"round",fill:"none",
                                        d:`M${x-r} ${y}H${x+r}M${x} ${y-r}V${y+r}`});
  if(sh==="star"){let p="";for(let i=0;i<10;i++){const rr=i%2?r*.46:r*1.25,an=-Math.PI/2+i*Math.PI/5;
      p+=`${x+rr*Math.cos(an)},${y+rr*Math.sin(an)} `;}
    return el("polygon",{...a,points:p.trim()});}
  return el("circle",{...a,cx:x,cy:y,r:r*.82});
}

let tc=null; const wrap=$("mapwrap");
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
const mid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
wrap.addEventListener("touchstart",e=>{
  if(e.touches.length===2){const m=mid(e.touches);
    tc={d:dist(e.touches),k:view.k,cx:m.x,cy:m.y,x:view.x,y:view.y};}
  else if(e.touches.length===1) tc={px:e.touches[0].clientX,py:e.touches[0].clientY,x:view.x,y:view.y};
},{passive:true});
wrap.addEventListener("touchmove",e=>{
  if(!tc) return;
  if(e.touches.length===2&&tc.d){
    const k=clamp(tc.k*dist(e.touches)/tc.d,1,5), s=k/tc.k;
    view.k=k; view.x=tc.cx-(tc.cx-tc.x)*s; view.y=tc.cy-(tc.cy-tc.y)*s;
  }else if(e.touches.length===1&&tc.px!=null&&view.k>1){
    view.x=tc.x+e.touches[0].clientX-tc.px; view.y=tc.y+e.touches[0].clientY-tc.py;
  }else return;
  e.preventDefault(); drawMap();
},{passive:false});

/* 캔들 + 이동평균 + 지지선 + EPS·매출 계단 */
/* ── 가격 차트 ─────────────────────────────────────────────────────
   정적 SVG 문자열이 아니라 상태를 갖는 컴포넌트다. 보이는 구간을
   [i0,i1) 인덱스 창으로 들고 있고, 확대·이동은 그 창만 움직인 뒤 다시 그린다.
   가격 범위도 창 안의 값으로만 잡는다 — 그래야 확대한 보람이 있다.

   일봉 5년이 실려 온다. 주봉은 서버가 따로 보내지 않고 여기서 묶는다 —
   같은 원본을 보므로 두 차트가 어긋날 일이 없고, 같은 구간을 두 벌 싣지 않아
   종목당 15KB 가 덜 나간다.
   ────────────────────────────────────────────────────────────────── */
const CHART={t:null,mode:"D",i0:0,i1:0,years:1,host:null,box:null,svg:null};
let CHARTDRAG=null;
/* 한 해치를 몇 봉으로 보는가. 기간 버튼이 이 값으로 창 크기를 잡는다. */
const YEAR_BARS={D:252,W:52};

/* 확대할 때마다 다시 묶으면 1260봉을 매 프레임 훑게 된다. 종목당 한 번만. */
const WEEKLY=new WeakMap();
const weeklyOf=s=>{
  let w=WEEKLY.get(s);
  if(!w){ w=aggWeekly(s); WEEKLY.set(s,w); }
  return w;
};

/* 일봉을 주 단위로 묶는다. 주가 바뀌는 지점은 '요일이 앞 봉보다 뒤로 가지 않을 때'.
   같은 주 안에서 요일은 반드시 커지므로(월→화→…→금), 작아지거나 같아지면 새 주다.
   공휴일로 주가 통째로 밀려도 이 규칙은 깨지지 않는다. */
function aggWeekly(s){
  const n=s.c.length, w={t:[],o:[],h:[],l:[],c:[],v:[],ma50:[],ma150:[],ma200:[]};
  const dow=d=>new Date(Date.UTC(2000+ +d.slice(0,2),+d.slice(2,4)-1,+d.slice(4,6))).getUTCDay();
  let prev=-1;
  for(let i=0;i<n;i++){
    const d=dow(s.t[i]), fresh=prev<0||d<=prev;
    prev=d;
    if(fresh){
      w.t.push(s.t[i]); w.o.push(s.o[i]); w.h.push(s.h[i]); w.l.push(s.l[i]);
      w.c.push(s.c[i]); w.v.push(s.v[i]||0);
      w.ma50.push(s.ma50?s.ma50[i]:null);
      w.ma150.push(s.ma150?s.ma150[i]:null);
      w.ma200.push(s.ma200?s.ma200[i]:null);
    }else{
      const k=w.t.length-1;
      w.t[k]=s.t[i];                       /* 라벨은 그 주의 마지막 거래일 */
      if(s.h[i]!=null&&(w.h[k]==null||s.h[i]>w.h[k])) w.h[k]=s.h[i];
      if(s.l[i]!=null&&(w.l[k]==null||s.l[i]<w.l[k])) w.l[k]=s.l[i];
      w.c[k]=s.c[i];
      w.v[k]+=s.v[i]||0;
      /* 이동평균은 다시 굴리지 않고 그 주 마지막 값을 쓴다. 주봉으로 다시 계산하면
         같은 이름의 선이 일봉 차트와 다른 값을 가리키게 된다. */
      if(s.ma50) w.ma50[k]=s.ma50[i];
      if(s.ma150) w.ma150[k]=s.ma150[i];
      if(s.ma200) w.ma200[k]=s.ma200[i];
    }
  }
  return w;
}

const chartBars=(t,mode)=>{
  const s=t&&t.series; if(!s||!s.c||!s.c.length) return null;
  if(mode==="W"){ const w=weeklyOf(s); return w.c.length>2?w:null; }
  return s;
};

const fmtVol=v=>v>=1e9?(v/1e9).toFixed(1)+"B":v>=1e6?Math.round(v/1e6)+"M"
               :v>=1e3?Math.round(v/1e3)+"K":String(v|0);
const fmtPx=v=>Math.abs(v)>=1000?v.toFixed(0):Math.abs(v)>=100?v.toFixed(1):v.toFixed(2);
const fmtDay=s=>`${s.slice(0,2)}-${s.slice(2,4)}-${s.slice(4,6)}`;
/* 창이 넓으면 연-월, 좁으면 월/일. 라벨이 6개뿐이라 둘을 섞으면 읽기 어렵다. */
const fmtTick=(s,long)=>long?`${s.slice(0,2)}-${s.slice(2,4)}`:`${s.slice(2,4)}/${s.slice(4,6)}`;

/* 축 눈금을 1·2·5 배수로 떨어뜨린다. 그냥 (hi-lo)/n 으로 자르면
   1234.56 같은 숫자가 축에 박혀서 읽히지 않는다. */
function niceTicks(lo,hi,count){
  const raw=(hi-lo)/Math.max(1,count);
  if(!(raw>0)) return [lo];
  const mag=Math.pow(10,Math.floor(Math.log10(raw))), k=raw/mag;
  const step=(k<1.5?1:k<3.5?2:k<7.5?5:10)*mag;
  const out=[];
  for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9 && out.length<12; v+=step) out.push(+v.toFixed(6));
  return out;
}

function mountChart(host,t){
  if(!chartBars(t,"D")||chartBars(t,"D").c.length<10){
    host.innerHTML='<p class="note">가격 시리즈가 없습니다.</p>'; CHART.t=null; return;
  }
  CHART.t=t; CHART.host=host;
  const hasW=!!chartBars(t,"W");
  /* 기간 버튼은 실려 온 봉 수가 감당하는 것만 띄운다. 상장한 지 2년인 종목에
     5년 버튼을 보여 봐야 눌러도 아무 일이 없다. */
  const nD=chartBars(t,"D").c.length;
  const spans=[1,2,3,5].filter(y=>y===1||nD>=YEAR_BARS.D*y*0.75);
  host.innerHTML=`<div class="chart-bar">
      <div class="seg">
        <button data-m="D" class="on">일봉</button>
        ${hasW?'<button data-m="W">주봉</button>':""}
      </div>
      <div class="seg">
        ${spans.map(y=>`<button data-y="${y}">${y}년</button>`).join("")}
        <button data-y="0">전체</button>
      </div>
    </div>
    <div class="chart-range"></div>
    <div class="chart-box"><svg></svg></div>`;
  CHART.box=host.querySelector(".chart-box");
  CHART.svg=host.querySelector(".chart-box svg");
  host.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>chartMode(b.dataset.m));
  host.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>chartSpan(+b.dataset.y));
  bindChartBox();
  CHART.mode="D"; CHART.years=1;
  chartMode("D");
}

function chartMode(m){
  if(!chartBars(CHART.t,m)) return;
  CHART.mode=m;
  CHART.host.querySelectorAll("[data-m]").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  /* 보고 있던 기간은 그대로 들고 넘어간다. 2년을 보다 주봉으로 바꿨는데
     기간이 5년으로 튀면 같은 구간을 다시 찾아야 한다. */
  chartSpan(CHART.years==null?0:CHART.years);
}

/* yr 년치가 보이도록 창을 맞춘다. 0 이면 실려 온 전부. */
function chartSpan(yr){
  const s=chartBars(CHART.t,CHART.mode); if(!s) return;
  const n=s.c.length;
  const win=yr?Math.max(8,Math.min(n,Math.round(YEAR_BARS[CHART.mode]*yr))):n;
  CHART.i1=n; CHART.i0=n-win;
  /* 0 은 '전체' 라는 선택이고 null 은 '손으로 확대해 아무 버튼도 아님' 이다.
     둘을 뭉개면 자유 확대 뒤에 전체 버튼이 켜져 있게 된다. */
  CHART.years=yr;
  drawChart();
}

/* 창 크기를 nm 으로 바꾸고 anchor(0~1) 지점을 제자리에 붙든다. */
function chartZoom(nm,anchor){
  const s=chartBars(CHART.t,CHART.mode); if(!s) return;
  const n=s.c.length, m=CHART.i1-CHART.i0;
  const at=CHART.i0+anchor*m;
  nm=Math.max(8,Math.min(n,Math.round(nm)));
  let a=Math.round(at-anchor*nm), b=a+nm;
  if(a<0){a=0;b=nm;}
  if(b>n){b=n;a=Math.max(0,n-nm);}
  CHART.i0=a; CHART.i1=b;
  CHART.years=null;          /* 손으로 확대했으면 기간 버튼의 선택을 푼다 */
  drawChart();
}

function chartPan(ratio){
  const s=chartBars(CHART.t,CHART.mode); if(!s) return;
  const n=s.c.length, m=CHART.i1-CHART.i0;
  let a=Math.round(CHART.i0+ratio*m), b=a+m;
  if(a<0){a=0;b=m;}
  if(b>n){b=n;a=Math.max(0,n-m);}
  if(a===CHART.i0) return;
  CHART.i0=a; CHART.i1=b; drawChart();
}

function bindChartBox(){
  const box=CHART.box; if(!box) return;
  box.addEventListener("wheel",e=>{
    e.preventDefault();
    const r=box.getBoundingClientRect(), m=CHART.i1-CHART.i0;
    chartZoom(m*(e.deltaY>0?1.18:0.85),(e.clientX-r.left)/(r.width||1));
  },{passive:false});
  box.addEventListener("mousedown",e=>{
    CHARTDRAG={x:e.clientX,w:box.clientWidth||1}; e.preventDefault();
  });
  let tp=null;
  box.addEventListener("touchstart",e=>{
    if(e.touches.length===2){
      tp={d:Math.abs(e.touches[0].clientX-e.touches[1].clientX)||1,
          m:CHART.i1-CHART.i0,at:CHART.i0+(CHART.i1-CHART.i0)/2};
    }else if(e.touches.length===1){
      tp={x:e.touches[0].clientX,y:e.touches[0].clientY,w:box.clientWidth||1,axis:null};
    }
  },{passive:true});
  box.addEventListener("touchmove",e=>{
    if(!tp) return;
    if(e.touches.length===2&&tp.d){
      e.preventDefault();
      const d=Math.abs(e.touches[0].clientX-e.touches[1].clientX)||1;
      const n=(chartBars(CHART.t,CHART.mode)||{c:[]}).c.length;
      const nm=Math.max(8,Math.min(n,Math.round(tp.m*tp.d/d)));
      let a=Math.round(tp.at-nm/2), b=a+nm;
      if(a<0){a=0;b=nm;}
      if(b>n){b=n;a=Math.max(0,n-nm);}
      CHART.i0=a; CHART.i1=b; CHART.years=null; drawChart();
      return;
    }
    if(e.touches.length===1&&tp.x!=null){
      const dx=e.touches[0].clientX-tp.x, dy=e.touches[0].clientY-tp.y;
      /* 첫 움직임의 방향으로 주인을 정한다. 세로면 상세 시트 스크롤에 넘긴다. */
      if(tp.axis===null){
        if(Math.abs(dx)<3&&Math.abs(dy)<3) return;
        tp.axis=Math.abs(dx)>Math.abs(dy)?"x":"y";
      }
      if(tp.axis!=="x") return;
      e.preventDefault();
      tp.x=e.touches[0].clientX; tp.y=e.touches[0].clientY;
      chartPan(-dx/tp.w);
    }
  },{passive:false});
  box.addEventListener("touchend",()=>{tp=null;},{passive:true});
}

/* 드래그는 창 전체에서 받는다 — 커서가 차트를 벗어나도 이어지도록.
   차트를 열 때마다 붙이면 리스너가 쌓이므로 여기서 한 번만 건다. */
window.addEventListener("mousemove",e=>{
  if(!CHARTDRAG) return;
  const dx=e.clientX-CHARTDRAG.x;
  if(!dx) return;
  CHARTDRAG.x=e.clientX;
  chartPan(-dx/CHARTDRAG.w);
});
window.addEventListener("mouseup",()=>{CHARTDRAG=null;});

function drawChart(){
  const t=CHART.t, s=chartBars(t,CHART.mode), svg=CHART.svg;
  if(!t||!s||!svg) return;
  const n=s.c.length;
  let i0=Math.max(0,Math.min(Math.round(CHART.i0),Math.max(0,n-8)));
  let i1=Math.min(n,Math.max(Math.round(CHART.i1),i0+8));
  CHART.i0=i0; CHART.i1=i1;
  const m=i1-i0, sl=a=>a?a.slice(i0,i1):null;
  const vo=sl(s.o), vh=sl(s.h), vl=sl(s.l), vc=sl(s.c), vv=sl(s.v), vt=sl(s.t);

  const W=CHART.box.clientWidth||document.body.clientWidth-32;
  const hasE=!!(t.quarters&&t.quarters.length);
  const padL=6, padR=54, padT=10;
  const PH=190, VH=56, EH=hasE?52:0, gapPV=16, gapVE=12, dateH=22;
  const H=padT+PH+gapPV+VH+(hasE?gapVE+EH:0)+dateH;
  const plotL=padL, plotR=W-padR;
  const pTop=padT, pBot=pTop+PH;
  const vTop=pBot+gapPV, vBot=vTop+VH;
  const eTop=vBot+gapVE, eBot=eTop+EH;
  const axisY=hasE?eBot:vBot;

  /* 세로 범위는 보이는 구간에서만 잡는다. */
  let lo=Infinity, hi=-Infinity;
  vl.forEach(v=>{ if(v!=null&&v<lo) lo=v; });
  vh.forEach(v=>{ if(v!=null&&v>hi) hi=v; });
  ["ma50","ma150","ma200"].forEach(k=>{
    const a=sl(s[k]); if(!a) return;
    a.forEach(v=>{ if(v!=null){ if(v<lo)lo=v; if(v>hi)hi=v; } });
  });
  if(!(hi>lo)){ lo=(lo===Infinity?0:lo)-1; hi=lo+2; }
  const gap=(hi-lo)*0.06; lo-=gap; hi+=gap;

  const cell=(plotR-plotL)/m;
  const x=i=>plotL+(i+0.5)*cell;
  const bw=Math.max(1,Math.min(14,cell*0.68));
  const y=v=>pBot-(v-lo)/(hi-lo)*PH;

  const o=[`<rect x="0" y="0" width="${W}" height="${H}" fill="var(--ground)"/>`];

  /* 가로 격자 + 가격 눈금 */
  niceTicks(lo,hi,4).forEach(v=>{
    const yy=y(v); if(yy<pTop-.5||yy>pBot+.5) return;
    o.push(`<line x1="${plotL}" y1="${yy.toFixed(1)}" x2="${plotR}" y2="${yy.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`,
           `<text x="${plotR+5}" y="${(yy+3.4).toFixed(1)}" fill="var(--axis)" style="font:500 9px var(--mono)">${fmtPx(v)}</text>`);
  });

  /* 세로 격자 + 날짜 눈금 */
  const long=CHART.mode==="W"||m>190;
  const every=Math.max(1,Math.round(m/5));
  for(let i=0;i<m;i+=every){
    const cx=x(i); if(cx>plotR-12) break;
    /* 양 끝 라벨은 가운데 정렬하면 화면 밖으로 삐져나간다. 끝에서는 안쪽으로 붙인다. */
    const an=cx<24?"start":cx>plotR-24?"end":"middle";
    const tx=an==="start"?plotL:an==="end"?plotR:cx;
    o.push(`<line x1="${cx.toFixed(1)}" y1="${pTop}" x2="${cx.toFixed(1)}" y2="${axisY}" stroke="var(--grid)" stroke-width="1" opacity=".7"/>`,
           `<text x="${tx.toFixed(1)}" y="${axisY+14}" text-anchor="${an}" fill="var(--axis)" style="font:500 9px var(--mono)">${fmtTick(vt[i],long)}</text>`);
  }

  /* 이동평균. 200일선이 화면의 기준선이라 가장 굵고 진하게 둔다. */
  [["ma200","var(--ma200)",1.5],["ma150","var(--ma150)",1],["ma50","var(--ma50)",1.2]].forEach(([k,col,sw])=>{
    const a=s[k]; if(!a) return;
    let d="",pen=false;
    for(let i=i0;i<i1;i++){
      const v=a[i];
      if(v==null){ pen=false; continue; }
      d+=`${pen?"L":"M"}${x(i-i0).toFixed(1)} ${y(v).toFixed(1)}`; pen=true;
    }
    if(d) o.push(`<path d="${d}" fill="none" stroke="${col}" stroke-width="${sw}" opacity=".92"/>`);
  });

  /* 캔들. 5년 일봉이면 1260봉이 900px 안에 들어가 한 봉이 1px 도 안 된다.
     그 폭에서는 몸통이 심지와 구분되지 않고, 봉마다 노드를 만들면 2500개가 넘어
     끌 때 눈에 띄게 밀린다. 그래서 촘촘할 때는 오르내림 두 갈래로 나눠
     path 두 개에 몰아 그린다 — 그림은 같고 노드는 2개다. */
  /* 2.2px 아래면 몸통 폭이 1.5px 도 안 돼 심지와 구분되지 않는다.
     화면이 좁은 폰에서는 1년 일봉도 여기에 걸려 자연히 가벼워진다. */
  const thin=cell<2.2;
  if(thin){
    let up="",dn="";
    for(let i=0;i<m;i++){
      if(vc[i]==null||vo[i]==null) continue;
      const seg=`M${x(i).toFixed(1)} ${y(vh[i]).toFixed(1)}V${y(vl[i]).toFixed(1)}`;
      if(vc[i]>=vo[i]) up+=seg; else dn+=seg;
    }
    if(up) o.push(`<path d="${up}" fill="none" stroke="var(--up)" stroke-width="1"/>`);
    if(dn) o.push(`<path d="${dn}" fill="none" stroke="var(--down)" stroke-width="1"/>`);
  }else{
    for(let i=0;i<m;i++){
      if(vc[i]==null||vo[i]==null) continue;
      const col=vc[i]>=vo[i]?"var(--up)":"var(--down)", cx=x(i).toFixed(1);
      o.push(`<line x1="${cx}" y1="${y(vh[i]).toFixed(1)}" x2="${cx}" y2="${y(vl[i]).toFixed(1)}" stroke="${col}" stroke-width="1"/>`);
      const a=y(vo[i]), b=y(vc[i]);
      o.push(`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${Math.min(a,b).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,Math.abs(b-a)).toFixed(1)}" fill="${col}"/>`);
    }
  }

  /* 지지선 — 가격축 쪽에 태그로. 캔들 위에 글자를 얹지 않는다. */
  [[t.stop1_pct],[t.stop2_pct]].forEach(([p])=>{
    if(p==null||!t.price) return;
    const lv=t.price*(1+p/100); if(lv<lo||lv>hi) return;
    const yy=y(lv);
    o.push(`<line x1="${plotL}" y1="${yy.toFixed(1)}" x2="${plotR}" y2="${yy.toFixed(1)}" stroke="var(--weaken)" stroke-width="1" stroke-dasharray="3 4" opacity=".6"/>`);
  });

  /* 마지막 종가 — 축 위에 칩으로 얹는다. */
  const last=vc[m-1];
  if(last!=null){
    const yy=Math.max(pTop+6,Math.min(pBot-1,y(last)));
    o.push(`<rect x="${plotR+2}" y="${(yy-7).toFixed(1)}" width="${padR-4}" height="14" rx="3" fill="var(--text)"/>`,
           `<text x="${plotR+5}" y="${(yy+3.4).toFixed(1)}" fill="var(--ground)" style="font:700 9px var(--mono)">${fmtPx(last)}</text>`);
  }

  /* 거래량 */
  let vmax=0; vv.forEach(v=>{ if(v>vmax) vmax=v; });
  vmax=vmax||1;
  o.push(`<line x1="${plotL}" y1="${vBot}" x2="${plotR}" y2="${vBot}" stroke="var(--hair)" stroke-width="1"/>`);
  if(thin){
    let up="",dn="";
    for(let i=0;i<m;i++){
      const hgt=(vv[i]||0)/vmax*VH; if(hgt<=0) continue;
      const seg=`M${x(i).toFixed(1)} ${vBot}V${(vBot-hgt).toFixed(1)}`;
      if(vc[i]>=vo[i]) up+=seg; else dn+=seg;
    }
    if(up) o.push(`<path d="${up}" fill="none" stroke="var(--up)" stroke-width="1" opacity=".6"/>`);
    if(dn) o.push(`<path d="${dn}" fill="none" stroke="var(--down)" stroke-width="1" opacity=".6"/>`);
  }else{
    for(let i=0;i<m;i++){
      const hgt=(vv[i]||0)/vmax*VH; if(hgt<=0) continue;
      o.push(`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${(vBot-hgt).toFixed(1)}" width="${bw.toFixed(1)}" height="${hgt.toFixed(1)}" fill="${vc[i]>=vo[i]?"var(--up)":"var(--down)"}" opacity=".6"/>`);
    }
  }
  o.push(`<text x="${plotL+2}" y="${vTop+9}" fill="var(--axis)" style="font:600 9px var(--sans)">거래량</text>`,
         `<text x="${plotR+5}" y="${vTop+9}" fill="var(--axis)" style="font:500 9px var(--mono)">${fmtVol(vmax)}</text>`);

  /* EPS·매출 계단 — 다음 발표일까지 수평. 분기값을 그대로 쓴다. */
  if(hasE){
    const qs=t.quarters;
    const pos=d=>{
      let i=s.t.findIndex(v=>v>=d);
      if(i<0) i=n-1;
      return x(Math.max(0,Math.min(m-1,i-i0)));
    };
    const es=qs.map(q=>q.eps).filter(v=>v!=null), rs=qs.map(q=>q.rev).filter(v=>v!=null);
    const eLo=Math.min(...es), eHi=Math.max(...es), eSpan=(eHi-eLo)||1;
    const rLo=Math.min(...rs), rHi=Math.max(...rs), rSpan=(rHi-rLo)||1;
    const eY=v=>eBot-6-(v-eLo)/eSpan*(EH*0.42);
    const rY=v=>eBot-6-(EH*0.5)-(v-rLo)/rSpan*(EH*0.34);
    let de="",dr="";
    qs.forEach((q,i)=>{
      const x0=pos(q.date), x1=i+1<qs.length?pos(qs[i+1].date):plotR;
      if(q.eps!=null) de+=`${de?"L":"M"}${x0.toFixed(1)} ${eY(q.eps).toFixed(1)}L${x1.toFixed(1)} ${eY(q.eps).toFixed(1)}`;
      if(q.rev!=null) dr+=`${dr?"L":"M"}${x0.toFixed(1)} ${rY(q.rev).toFixed(1)}L${x1.toFixed(1)} ${rY(q.rev).toFixed(1)}`;
    });
    if(dr) o.push(`<path d="${dr}" fill="none" stroke="var(--improve)" stroke-width="1.2" opacity=".7"/>`);
    if(de) o.push(`<path d="${de}" fill="none" stroke="var(--ma50)" stroke-width="1.8"/>`);
    o.push(`<text x="${plotL+2}" y="${eTop+9}" fill="var(--axis)" style="font:600 9px var(--sans)">분기 EPS · 매출</text>`);
  }

  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.setAttribute("height",H);
  svg.innerHTML=o.join("");

  const rng=CHART.host.querySelector(".chart-range");
  if(rng){
    const yrs=(m/YEAR_BARS[CHART.mode]).toFixed(1);
    rng.textContent=`${fmtDay(vt[0])} → ${fmtDay(vt[m-1])} · ${m}봉 · 약 ${yrs}년`;
  }
  CHART.host.querySelectorAll("[data-y]").forEach(b=>
    b.classList.toggle("on",CHART.years!=null&&+b.dataset.y===CHART.years));
}

(function start(){
  const seed=()=>{
    try{ boot(JSON.parse($("seed").textContent), "내장"); }
    catch(e){ $("cards").innerHTML='<div id="empty">스냅샷을 읽지 못했습니다.</div>'; }
  };
  if(typeof fetch!=="function"){ seed(); return; }

  /* 원격 → 같은 폴더 파일 → 내장 순으로 시도한다.
     원격이 죽어도 화면이 비지 않는 게 중요하다. 어제 데이터라도 보이는 편이 낫다. */
  const get=(url,label)=>fetch(url,{cache:"no-store"})
      .then(r=>r.ok?r.json():Promise.reject(r.status))
      .then(d=>boot(d,label));

  const chain = SNAPSHOT_URL
    ? get(SNAPSHOT_URL+"?t="+Date.now(),"원격").catch(()=>get("latest.json","로컬"))
    : get("latest.json","로컬");

  try{ chain.catch(seed); }catch(e){ seed(); }
})();

/* 기준일을 누르면 다시 받아온다. */
$("m-asof").addEventListener("click",()=>{
  if(!SNAPSHOT_URL) return;
  $("m-asof").textContent="갱신 중…";
  fetch(SNAPSHOT_URL+"?t="+Date.now(),{cache:"no-store"})
    .then(r=>r.json()).then(d=>boot(d,"원격"))
    .catch(()=>{ $("m-asof").textContent="갱신 실패"; });
});
</script>
